<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc }
    .card { fill: #ffffff; stroke: #e6eef7 }
    .title { font: 700 22px/1.2 Inter, Arial, sans-serif; fill: #0f172a }
    .subtitle { font: 400 13px/1.2 Inter, Arial, sans-serif; fill: #475569 }
    .kpi-num { font: 700 28px Inter, Arial, sans-serif; fill: #0f172a }
    .kpi-label { font: 400 12px Inter, Arial, sans-serif; fill: #64748b }
    .small { font: 400 13px Inter, Arial, sans-serif; fill: #0f172a }
    .muted { fill: #94a3b8 }
    .chart-line { stroke: #06b6d4; stroke-width: 3; fill: none; stroke-linecap: round }
  </style>

  <rect x="0" y="0" width="1400" height="900" class="bg" />

  <!-- Header -->
  <rect x="32" y="24" width="1336" height="76" rx="10" class="card" />
  <text x="56" y="66" class="title">Chatbot Dashboard</text>
  <text x="56" y="88" class="subtitle">Overview · Analytics · Conversations</text>

  <!-- KPI row -->
  <g transform="translate(32,120)">
    <rect x="0" y="0" width="420" height="120" rx="10" class="card" />
    <text x="24" y="40" class="kpi-num">1,234</text>
    <text x="24" y="68" class="kpi-label">Total completed turns</text>

    <rect x="452" y="0" width="420" height="120" rx="10" class="card" />
    <text x="476" y="40" class="kpi-num">432</text>
    <text x="476" y="68" class="kpi-label">Total conversations</text>

  <!-- Removed completion rate per request -->
  </g>

  <!-- Main content -->
  <!-- Left column: chart + active users + top unanswered -->
  <g transform="translate(32,260)">
    <rect x="0" y="0" width="920" height="520" rx="10" class="card" />
    <text x="24" y="36" class="small">Messages / day (30d)</text>

    <!-- enlarged line chart area -->
    <rect x="24" y="52" width="872" height="380" rx="8" fill="#fbfdff" stroke="#eef6fb" />
    <!-- bar chart replacing the line chart -->
    <g fill="#06b6d4">
      <rect x="56" y="360" width="28" height="72" rx="4" />
      <rect x="96" y="320" width="28" height="112" rx="4" />
      <rect x="136" y="280" width="28" height="152" rx="4" />
      <rect x="176" y="260" width="28" height="172" rx="4" />
      <rect x="216" y="240" width="28" height="192" rx="4" />
      <rect x="256" y="260" width="28" height="172" rx="4" />
      <rect x="296" y="300" width="28" height="132" rx="4" />
      <rect x="336" y="320" width="28" height="112" rx="4" />
      <rect x="376" y="340" width="28" height="92" rx="4" />
      <rect x="416" y="360" width="28" height="72" rx="4" />
      <rect x="456" y="380" width="28" height="52" rx="4" />
      <rect x="496" y="360" width="28" height="72" rx="4" />
      <rect x="536" y="340" width="28" height="92" rx="4" />
      <rect x="576" y="320" width="28" height="112" rx="4" />
      <rect x="616" y="300" width="28" height="132" rx="4" />
      <rect x="656" y="280" width="28" height="152" rx="4" />
      <rect x="696" y="260" width="28" height="172" rx="4" />
      <rect x="736" y="240" width="28" height="192" rx="4" />
    </g>
    <text x="48" y="452" class="muted">-30d</text>
    <text x="880" y="452" class="muted">Today</text>

    <!-- Active users & Top unanswered below the chart -->
    <rect x="24" y="444" width="420" height="56" rx="8" fill="#ffffff" stroke="#eef2ff" />
    <text x="40" y="476" class="small">Active users (24h): <tspan class="kpi-num">78</tspan></text>

    <rect x="468" y="444" width="428" height="56" rx="8" fill="#ffffff" stroke="#eef2ff" />
    <text x="484" y="476" class="small">Top unanswered: "How about any food?" (12)</text>
  </g>

  <!-- Right column: recent conversations + users list -->
  <g transform="translate(980,260)">
    <rect x="0" y="0" width="388" height="520" rx="10" class="card" />
    <text x="24" y="36" class="small">Recent conversations</text>

    <!-- table headers -->
    <text x="24" y="64" class="muted">Time</text>
    <text x="160" y="64" class="muted">User</text>
    <text x="300" y="64" class="muted">Snippet</text>

    <!-- sample rows -->
    <text x="24" y="94" class="small">2025-09-24 07:36</text>
    <text x="160" y="94" class="small">Himanshu</text>
    <text x="300" y="94" class="small">How about any food?</text>

    <text x="24" y="120" class="small">2025-09-24 07:30</text>
    <text x="160" y="120" class="small">Olivia</text>
    <text x="300" y="120" class="small">Any vegan options?</text>

    <text x="24" y="146" class="small">2025-09-23 21:10</text>
    <text x="160" y="146" class="small">Carlos</text>
    <text x="300" y="146" class="small">Where is my order?</text>

    <!-- users list compact -->
    <rect x="0" y="200" width="368" height="200" rx="8" fill="#ffffff" stroke="#eef2ff" />
    <text x="24" y="228" class="small">Users</text>
    <text x="24" y="252" class="small">Himanshu · Olivia · Carlos</text>
    <text x="24" y="276" class="small">Unassigned (orphan messages)</text>

    <!-- actions -->
    <rect x="24" y="316" width="160" height="36" rx="8" fill="#0ea5a4" />
    <text x="56" y="340" font="700 13px Inter" fill="#fff">Export CSV</text>
    <rect x="200" y="316" width="160" height="36" rx="8" fill="#7c3aed" />
    <text x="232" y="340" font="700 13px Inter" fill="#fff">View users</text>

    <!-- Show all users button -->
    <rect x="24" y="360" width="336" height="40" rx="8" fill="#ffffff" stroke="#e6eef7" />
    <text x="48" y="388" class="small">Show all users</text>
  </g>

  <!-- Footer / Features list -->
  <g transform="translate(32,700)">
    <rect x="0" y="0" width="1336" height="140" rx="10" class="card" />
    <text x="24" y="32" class="small">MVP features included:</text>
    <text x="24" y="56" class="muted">• Protected admin access (Supabase Auth)</text>
    <text x="24" y="76" class="muted">• Recent conversations list (exclude null bot responses from KPIs)</text>
    <text x="24" y="96" class="muted">• User timeline / conversation detail (grouped by conversation_id)</text>
    <text x="360" y="56" class="muted">• Messages/day timeseries (30d)</text>
    <text x="360" y="76" class="muted">• Top unanswered prompts (triage)</text>
    <text x="360" y="96" class="muted">• Export CSV, basic filters (date range, include_unanswered)</text>
  </g>

</svg>